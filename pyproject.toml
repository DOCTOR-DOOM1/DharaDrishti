[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dharadrishti-pipeline"
version = "0.1.0"
description = "DharaDrishti InSAR pipeline — Yash's track"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.scripts]
dd = "pipeline.dd.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

