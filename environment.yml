name: dharadrishti
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # SAR / InSAR
  - asf_search=7.0.6
  - gdal=3.8.4
  - rasterio=1.3.10
  - rioxarray=0.15.5
  - xarray=2024.2.0
  - zarr=2.16.1
  # Science
  - numpy=1.26.4
  - scipy=1.12.0
  - scikit-learn=1.4.1   # for HDBSCAN (used by Shivani; listed here for shared env)
  # Geospatial
  - geopandas=0.14.3
  - shapely=2.0.3
  - pyproj=3.6.1
  # Utility
  - pyyaml=6.0.1
  - click=8.1.7
  - tqdm=4.66.2
  - requests=2.31.0
  - boto3=1.34.50         # MinIO / S3 interactions
  - pip
  - pip:
      - hyp3_sdk==2.8.0
      - mintpy==1.5.3
      - netCDF4==1.6.5
      - h5py==3.10.0
      - asf_search==7.0.6  # also via pip to ensure latest

